services:
  - type: web
    name: tds-ga3-invoice-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_TOKEN
        generateValue: true
      - key: BASE_URL
        value: https://REPLACE-WITH-YOUR-RENDER-HOST/a2a/
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gpt-4o-mini
